name: Post to Slack
description: >-
  Post the same message to one or more Slack channels via chat.postMessage,
  failing the step if Slack rejects any of them.

inputs:
  token:
    description: Slack bot token (xoxb-…) with chat:write on the target channels.
    required: true
  channels:
    description: >-
      Channel IDs to post to, separated by whitespace or newlines.
      Blank lines and lines starting with # are ignored.
    required: true
  text:
    description: Message body (Slack mrkdwn).
    required: true

runs:
  using: composite
  steps:
    - name: Post message
      shell: bash
      env:
        SLACK_TOKEN: ${{ inputs.token }}
        SLACK_CHANNELS: ${{ inputs.channels }}
        SLACK_TEXT: ${{ inputs.text }}
      run: |
        set -uo pipefail

        if [ -z "${SLACK_TOKEN// /}" ]; then
          echo "::error::slack-post: 'token' input is empty"
          exit 1
        fi

        # Strip comments, then split on any whitespace into the channel list.
        mapfile -t CHANNELS < <(printf '%s\n' "$SLACK_CHANNELS" | sed 's/#.*//' | tr -s '[:space:]' '\n' | grep -v '^$' || true)

        if [ "${#CHANNELS[@]}" -eq 0 ]; then
          echo "::error::slack-post: no channels resolved from the 'channels' input"
          exit 1
        fi

        FAILED=0
        for CH in "${CHANNELS[@]}"; do
          BODY=$(jq -n --arg ch "$CH" --arg text "$SLACK_TEXT" '{channel: $ch, text: $text}')
          RESPONSE=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY") || RESPONSE=''

          # Slack answers HTTP 200 with {"ok":false,"error":"…"} on logical failures,
          # so the exit code of curl alone tells us nothing.
          if printf '%s' "$RESPONSE" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "Posted to $CH"
          else
            REASON=$(printf '%s' "$RESPONSE" | jq -r '.error // "no/invalid response from Slack"' 2>/dev/null || echo 'no/invalid response from Slack')
            echo "::error::slack-post: posting to $CH failed: $REASON"
            FAILED=1
          fi
        done

        exit "$FAILED"
