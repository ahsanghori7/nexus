<VirtualHost *:80>
        ServerName $APACHE_SERVER_NAME
        ServerAdmin $APACHE_SERVER_ADMIN
        DocumentRoot /var/www/html/framework/public
        Options FollowSymLinks

        <Directory /var/www/html/framework/public/>
            AllowOverride All
            Require all granted
        </Directory>

        SetEnv APP $APACHE_APP

        Header always set Access-Control-Allow-Origin $APACHE_ALLOW_ORIGIN
        Header always set Access-Control-Allow-Methods "HEAD, GET, POST, PUT, PATCH, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "X-API-KEY, Origin, X-Requested-With, Content-Type, Accept, Access-Control-Request-Method,Access-Control-Request-Headers, Authorization"

        ErrorLog /var/log/apache2/$APACHE_SERVER_NAME-error.log
        CustomLog /var/log/apache2/$APACHE_SERVER_NAME-access.log combined
</VirtualHost>
