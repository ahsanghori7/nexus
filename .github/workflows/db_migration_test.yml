name: TESTS - DB Migration Test

on:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Filter paths
        uses: dorny/paths-filter@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            migrations:
              - 'document_service/db/migrations/**'
              - 'account_service/db/migrations/**'
              - 'project_service/db/migrations/**'

  migration-test:
    needs: changes
    if: ${{ needs.changes.outputs.migrations == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Free space on the GitHub-hosted runner BEFORE any Docker work
      - name: Free disk space on runner
        run: |
          echo "=== Disk usage BEFORE cleanup ==="
          df -h

          echo "Removing large preinstalled SDKs..."
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc || true

          echo "Removing preinstalled Node.js from host..."
          sudo rm -rf /usr/share/nodejs \
                      /usr/lib/node_modules || true

          echo "Removing hosted tool cache..."
          sudo rm -rf /opt/hostedtoolcache || true

          echo "Cleaning apt cache..."
          sudo apt-get clean

          echo "Pruning any existing Docker data..."
          docker system prune -af --volumes || true

          echo "Docker usage after prune:"
          docker system df || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ECR_NEXUS }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY_ECR_NEXUS }}
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Create .env files for each service
      - name: Set up .env for account_service
        run: |
          echo "${{ secrets.ACCOUNT_SERVICE_DOTENV }}" > ./account_service/.env
      - name: Set up .env for project_service
        run: |
          echo "${{ secrets.PROJECT_SERVICE_DOTENV }}" > ./project_service/.env
      - name: Set up .env for document_service
        run: |
          echo "${{ secrets.DOCUMENT_SERVICE_DOTENV }}" > ./document_service/.env
      - name: Set up dummy .env for app.c-link and framework
        run: |
          touch  ./app.c-link/.env
          touch  ./framework/.env

      - name: Execute make recipe
        env:
          GITHUB_TOKEN: ${{ secrets.GA_TOKEN }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}/nexus/
        run: |
          make GITHUB_TOKEN="$GITHUB_TOKEN" REGISTRY="$ECR_REGISTRY" gh_action_migration_test
