# =============================================================================
# app.c-link.local — shared-origin vhost
#
# Two SPAs live on this single origin so they share the `token_development`
# cookie and the URL never leaves app.c-link.local:
#   - React / PHP (app.c-link)  → owns everything by default (catch-all below)
#   - Angular (orion)           → owns the allowlisted paths, forwarded to the
#                                 `angular` upstream
#
# `angular` is a STABLE service-discovery name, resolved identically in every
# environment, so this file needs no per-env edits:
#   - locally : docker network alias `angular` (orion/docker-compose.yml,
#               orion/docker-compose.dev.yml)
#   - in ECS  : Service Connect dnsName `angular`
#
# ORDER MATTERS: Apache evaluates ProxyPass rules top-down, first match wins.
# All Angular rules MUST stay above the catch-all `ProxyPass /`.
#
# Keep the Angular allowlist in sync with the source of truth:
#   orion/src/app/app.routes.ts
# =============================================================================
<VirtualHost *:80>
    ServerName app.c-link.local
    ProxyPreserveHost On
    RewriteEngine On

    # ── Vite / ng-serve HMR websocket — dev only ────────────────────────────
    # `ng serve` (Vite-based @angular/build:dev-server) opens its HMR
    # websocket at the SAME URL the page was served from — i.e. the browser
    # upgrades `ws://app.c-link.local/` (root path). That collides with the
    # `^/$ → /login` redirect below, which would otherwise hijack the upgrade
    # request and proxy it to PHP as plain HTTP. Match Upgrade: websocket
    # FIRST and bypass the redirect entirely. Harmless in prod — the prod
    # nginx image has no websocket endpoints, so this rule never fires.
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*)$        ws://angular/$1 [P,L]

    # Root → login (only for non-websocket requests; the WS rule above wins
    # when the Upgrade header is present).
    RewriteRule ^/$ /login [P,L]

    # ── Angular app (orion) — user-facing routes ────────────────────────────
    # Prefix match: `/users` also covers `/users/...` deep routes, etc.
    ProxyPass        /admin          http://angular/admin
    ProxyPassReverse /admin          http://angular/admin
    ProxyPass        /projects       http://angular/projects
    ProxyPassReverse /projects       http://angular/projects

    # ── Angular static assets + service worker (served at root by Angular) ──
    ProxyPass        /assets              http://angular/assets
    ProxyPassReverse /assets              http://angular/assets
    ProxyPass        /manifest.webmanifest http://angular/manifest.webmanifest
    ProxyPassReverse /manifest.webmanifest http://angular/manifest.webmanifest
    ProxyPass        /ngsw-worker.js      http://angular/ngsw-worker.js
    ProxyPassReverse /ngsw-worker.js      http://angular/ngsw-worker.js
    ProxyPass        /ngsw.json           http://angular/ngsw.json
    ProxyPassReverse /ngsw.json           http://angular/ngsw.json

    # ── Vite / ng-serve dev-server paths — dev only ─────────────────────────
    # The Vite-based @angular/build:dev-server injects extra `<script
    # type="module">` references into index.html (HMR client, virtual modules,
    # absolute-path imports, pre-bundled deps). None of these exist in the
    # nginx prod image, so the rules are no-ops outside dev — keeping them in
    # the shared vhost avoids a dev-only Apache config to maintain.
    ProxyPass        /@vite                http://angular/@vite
    ProxyPassReverse /@vite                http://angular/@vite
    ProxyPass        /@id                  http://angular/@id
    ProxyPassReverse /@id                  http://angular/@id
    ProxyPass        /@fs                  http://angular/@fs
    ProxyPassReverse /@fs                  http://angular/@fs
    ProxyPass        /@ng                  http://angular/@ng
    ProxyPassReverse /@ng                  http://angular/@ng
    ProxyPass        /__web_dev_server__   http://angular/__web_dev_server__
    ProxyPassReverse /__web_dev_server__   http://angular/__web_dev_server__
    ProxyPass        /__vite_ping          http://angular/__vite_ping
    ProxyPassReverse /__vite_ping          http://angular/__vite_ping
    ProxyPass        /.vite                http://angular/.vite
    ProxyPassReverse /.vite                http://angular/.vite
    ProxyPass        /node_modules         http://angular/node_modules
    ProxyPassReverse /node_modules         http://angular/node_modules

    # Angular's root bundles. Matches BOTH:
    #   - prod hashed names: main-DEADBEEF.js, polyfills-CAFE.css, chunk-*.map
    #   - dev unhashed names: main.js, polyfills.js, styles.css, vendor.js
    # Tight regex so it never swallows React/PHP asset paths.
    ProxyPassMatch   ^/((main|polyfills|chunk|styles|scripts|vendor|runtime)[^/]*\.(?:js|css|map))$ http://angular/$1

    # ── Everything else → existing app.c-link (PHP + React) — UNCHANGED ─────
    ProxyPass        / http://app.c-link/
    ProxyPassReverse / http://app.c-link/
</VirtualHost>
