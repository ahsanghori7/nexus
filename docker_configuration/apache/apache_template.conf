<VirtualHost *:80>
        ServerName $APACHE_SERVER_NAME
        serverAlias $SERVICE_NAME
        ServerAdmin $APACHE_SERVER_ADMIN
        DocumentRoot $APACHE_WEB_ROOT
        Options FollowSymLinks

        <Directory $APACHE_WEB_ROOT/>
            AllowOverride All
            Require all granted
        </Directory>

        <FilesMatch "\.php$">
            SetHandler  "proxy:fcgi://localhost:9000"
         </FilesMatch>

        ErrorLog /var/log/apache2/$SERVICE_NAME-error.log
        CustomLog /var/log/apache2/$SERVICE_NAME-access.log combined
</VirtualHost>
