# Project identification
sonar.projectKey=construction-link_nexus
sonar.organization=construction-link
sonar.projectName=nexus

# Source encoding
sonar.sourceEncoding=UTF-8

# ============================================================
# Source directories (all services)
# ============================================================
sonar.sources=\
  account_service/src,\
  project_service/src,\
  document_service/src,\
  app.c-link/app,\
  framework/src,\
  react-service/src

# ============================================================
# Test directories
# ============================================================
sonar.tests=\
  account_service/tests,\
  project_service/tests,\
  document_service/tests,\
  react-service/src

# React tests live alongside source files (*.test.js/jsx),
# so react-service/src is listed in both sources and tests.
# SonarCloud uses sonar.test.inclusions to distinguish them.
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/tests/**

# ============================================================
# Exclusions — files to skip during analysis
# ============================================================
sonar.exclusions=\
  **/node_modules/**,\
  **/vendor/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.husky/**,\
  **/migrations/**,\
  **/seeds/**,\
  **/docker_configuration/**,\
  **/playwright-tests/**,\
  **/documentation/**,\
  **/scripts/**,\
  app.c-link/**,\
  framework/**

# ============================================================
# Coverage report paths
# ============================================================
# PHP — Clover XML reports generated by PHPUnit
sonar.php.coverage.reportPaths=\
  account_service/build/logs/clover.xml,\
  project_service/build/logs/clover.xml,\
  document_service/build/logs/clover.xml

# JavaScript — LCOV report generated by Jest
sonar.javascript.lcov.reportPaths=\
  react-service/coverage/lcov.info
