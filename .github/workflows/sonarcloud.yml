name: SonarCloud Analysis

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for accurate blame/new code detection

      # ----------------------------------------------------------
      # PHP coverage: run unit tests for each service
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ECR_NEXUS }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY_ECR_NEXUS }}
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up .env files
        run: |
          echo "${{ secrets.ACCOUNT_SERVICE_DOTENV }}" > ./account_service/.env
          echo "${{ secrets.PROJECT_SERVICE_DOTENV }}" > ./project_service/.env
          echo "${{ secrets.DOCUMENT_SERVICE_DOTENV }}" > ./document_service/.env
          touch ./app.c-link/.env
          touch ./framework/.env

      - name: Run account_service tests
        run: ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}/nexus/ make account_service_unittests

      - name: Run project_service tests
        run: ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}/nexus/ make project_service_unittests

      - name: Run document_service tests
        run: ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}/nexus/ make document_service_unittests

      # ----------------------------------------------------------
      # React coverage: run Jest with coverage
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Use .npmrc
        uses: bduff9/use-npmrc@v1.1
        with:
          dot-npmrc: ${{ secrets.MY_NPMRC }}
          working-directory: ./react-service

      - name: Install React dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ./react-service

      - name: Create config.json
        uses: jsdaniell/create-json@1.1.2
        with:
          name: "config.json"
          json: ${{ secrets.MY_CONFIG }}
          dir: "react-service/"

      - name: Run React tests with coverage
        run: pnpm coverage
        working-directory: ./react-service

      # ----------------------------------------------------------
      # SonarCloud scan
      # ----------------------------------------------------------
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
